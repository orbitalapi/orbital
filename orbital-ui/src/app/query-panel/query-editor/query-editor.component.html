<as-split direction='horizontal' unit='percent'>
  <as-split-area>
    <as-split direction='vertical' unit='percent' class='query-panel-split'>
      <as-split-area [size]='50'>
        <div class="code-editor-panel-container">
          <app-panelset>
            <app-panel icon="assets/img/tabler/vocabulary.svg" title="Catalog">
              <app-catalog-explorer-panel
                (addToQueryClicked)="onAddToQueryClicked($event)"></app-catalog-explorer-panel>
            </app-panel>
            <app-panel icon="assets/img/tabler/history.svg" title="Query History">
              <app-query-history-panel
                (queryHistoryElementClicked)="queryHistoryElementClicked($event)"></app-query-history-panel>
            </app-panel>
            <app-panel icon="assets/img/tabler/device-floppy.svg" title="Saved queries">
              <app-saved-queries-panel
                (savedQueryClicked)="onSavedQuerySelected.emit($event)"
              ></app-saved-queries-panel>
            </app-panel>
          </app-panelset>
          <div class='code-editor-section'>
            <app-query-editor-toolbar
              [currentState]='state.currentState'
              [queryStarted]="state.queryStartTime()"
              [queryLanguage]='state.queryLanguage()'
              [runningQueryStatus]='state.queryMetadata() | async'
              [resultType]="state.resultType()"
              [savedQuery]="state.savedQueryWithSource()"
              (queryLanguageChange)="queryLanguageChanged.emit($event)"
              (executeQuery)='submitQuery.emit()'
              (cancelQuery)='cancelQuery.emit()'
              (copyQuery)='onCopyQuery.emit($event)'
              (saveClicked)="saveQuery()"
              (publishAsHttpEndpoint)="createEndpoint('HTTP')"
              (publishAsWebsocketpoint)="createEndpoint('WEBSOCKET')"
            >
            </app-query-editor-toolbar>
            <tui-notification
              size="s"
              status="error"
              *ngIf="state.lastErrorMessage()"
              class='error-notification'
            >
              <div class='error-message'>{{ state.lastErrorMessage() }}</div>
            </tui-notification>
            <div class='code-viewer-container' *ngIf='state.queryLanguage() === "TaxiQL"'>
              <app-code-editor
                class='code-editor'
                [actions]='customActions'
                [content]="state.query()"
                (contentChange)="onQueryChanged($event)"
                #editor
              ></app-code-editor>
            </div>
            <tui-text-area
              *ngIf='state.queryLanguage() === "Text"'
              class='flat query-input'
              [ngModel]='state.chatQuery()'
              (ngModelChange)="onChatQueryChanged($event)"
            >Write a
              query
            </tui-text-area>
          </div>
        </div>
      </as-split-area>
      <as-split-area size='50' [title]="!state.queryStartTime() ? 'Run a query first' : ''">
        <app-error-panel *ngIf='lastQueryResultAsSuccess?.unmatchedNodes?.length > 0'
                         [queryResult]='lastQueryResultAsSuccess'>
        </app-error-panel>
        <app-tabbed-results-view [instances$]='state.potentiallyPausedResults()'
                                 [profileData$]='state.queryProfileData()'
                                 [errorMessages$]="state.errors()"
                                 [errorCount]="state.errorCount()"
                                 [type]="state.resultType()"
                                 [anonymousTypes]="state.anonymousTypes()"
                                 [isQueryRunning]='state.currentState() === "Running"'
                                 [isStreamingQuery]="isStreamingQuery"
                                 [isQueryPaused]="state.isQueryPaused()"
                                 [class.is-disabled]="!state.queryStartTime()"
                                 (instanceSelected)='state.valuePanelVisible.set(true); state.instanceSelected().next($event)'
                                 (downloadClicked)='downloadQueryHistory($event.format)'
                                 (loadProfileData)='loadProfileData.emit()'
                                 (pauseStreamToggled)="pauseQuery.emit($event)"
        ></app-tabbed-results-view>
      </as-split-area>
    </as-split>
  </as-split-area>
  <as-split-area *ngIf="state.valuePanelVisible()" size="25">
    <app-typed-instance-panel-container
      [queryResultSelectedEvent$]="state.instanceSelected()"
      (close)="state.valuePanelVisible.set(false)"
    ></app-typed-instance-panel-container>
  </as-split-area>
</as-split>
