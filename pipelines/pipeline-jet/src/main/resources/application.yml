spring:
   application:
      name: pipeline-jet-runner
   main:
      web-application-type: reactive
      banner-mode: off
   codec:
      max-in-memory-size: 100MB
#      Why were these turned off?
#   autoconfigure:
#      exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration, org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration, org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
   cloud:
      config:
         enabled: false
   rsocket:
      server:
         port: 7755
         mapping-path: /api
         transport: tcp
#   jpa:
#      show-sql: true
   datasource:
      url: jdbc:postgresql://${vyne.db.host}:${vyne.db.port:5432}/${vyne.db.database:orbital}
      username: ${vyne.db.username}
      password: ${vyne.db.password}
      driver-class-name: org.postgresql.Driver

server:
   port: 9615
   error:
      whitelabel:
         enabled: false
      include-message: always

feign:
   client:
      config:
         default:
            connectTimeout: 5000
            readTimeout: 5000


vyne:
   graph:
      vyneGraphBuilderCache:
         baseSchemaCacheSize: 100
         graphWithFactTypesCacheSize: 100
         baseSchemaGraphCacheSize: 100
      vyneDiscoverGraphQuery:
         schemaGraphCacheSize: 5
         searchPathExclusionsCacheSize: 200000
   pipelines:
      query-mode: EMBEDDED


management:
   prometheus:
      metrics:
         export:
            enabled: true

   endpoints:
      web:
         exposure:
            include: prometheus,metrics,info,health,logfile,loggers
         base-path: /api/actuator

   endpoint:
      metrics:
         enabled: true
      prometheus:
         enabled: true
      health:
         show-components: always
         show-details: always
logging:
   level:
      io.vyne: DEBUG
      #       Enable this to get graph debug schemas:
#      io.vyne.query.GraphSearcher: TRACE
      us.fatehi.utility.scheduler: WARN
      schemacrawler.crawl: WARN
      schemacrawler.loader.attributes: WARN
      schemacrawler.loader.weakassociations: WARN
      schemacrawler.loader.counts: WARN
      schemacrawler.tools.utility: WARN
