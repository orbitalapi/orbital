name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    name: Create ${{ inputs.release_type }} release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version digit
        id: version-digit
        run: |
          case "${{ inputs.release_type }}" in
            major)
              echo "digit=0" >> $GITHUB_OUTPUT
              ;;
            minor)
              echo "digit=1" >> $GITHUB_OUTPUT
              ;;
            patch)
              echo "digit=2" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Run gitflow release
        run: |
          mvn gitflow:release -B -DversionDigitToIncrement=${{ steps.version-digit.outputs.digit }} -DskipTestProject=true
