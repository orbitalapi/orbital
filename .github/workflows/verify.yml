name: Verify

on:
  workflow_dispatch:

jobs:
  regression-test:
    name: Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build project
        run: mvn clean install -DskipTests -Dskip.npm

      - name: Run regression tests
        run: |
          cd regression-tests
          mvn -Dtest=TaxonomyRegressionTest -Drun.mode=docker -Dvyne.tag=latest test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: regression-tests/target/surefire-reports/TEST-*.xml
          retention-days: 7
