import "proto/src/org/taxilang/dataType.proto";

message CafeDrink {
   optional string customer_name = 1 [(taxi.dataType)="foo.CustomerName"];
   optional int32 customer_id = 2 [(taxi.dataType)="foo.CustomerId"];

   enum Foam {
      NOT_FOAMY_AND_QUITE_BORING = 1;
      ZOMG_SO_FOAMY = 3;
   }
}
