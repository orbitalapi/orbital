file {
   changeDetectionMethod=WATCH
   incrementVersionOnChange=false
   projects=[
      { path: "/a/b/c/project" }
   ]
   pollFrequency=PT5S
   recompilationFrequencyMillis=PT3S
}
git {
   checkoutRoot="/my/git/root"
   pollFrequency=PT30S
   repositories=[
      {
         branch=master
         name=my-git-project
         uri="https://github.com/something.git"
      }
   ]
}
