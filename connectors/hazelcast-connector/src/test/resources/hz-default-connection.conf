hazelcast {
         integrationHazelcast {
                connectionName = integrationHazelcast
                default = true
                addresses = ["localhost"]
         }

         clientWithXmlConfig {
               connectionName = clientWithXmlConfig
               xmlConfig = "hazelcast-client.xml"
         }

         clientWithYamlConfig {
               connectionName = clientWithYamlConfig
               yamlConfig = "hazelcast-client.yaml"
         }
}
